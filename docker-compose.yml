services:
  nginx:
    image: nginx:alpine
    container_name: routing_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routing_api
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: routing_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

volumes:
  redis_data:
