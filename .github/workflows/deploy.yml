name: Deploy to AWS EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push for ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/routing-engine:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/routing-engine:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/routing-engine:buildcache,mode=max

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Bỏ qua kiểm tra StrictHostKeyChecking lần đầu tiên
          script_stop: true
          script: |
            cd ~/routing-engine
            git pull
            # Kéo image arm64 mới nhất về
            docker compose pull api
            # Khởi động lại api với image mới
            docker compose up -d --no-build api
            docker compose up -d nginx
            docker compose logs --tail=20 api
