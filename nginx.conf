proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;

    # ── Frontend: serve static files trực tiếp từ Nginx (nhanh hơn FastAPI) ──
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(css|js|ico|png|jpg|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API: proxy đến FastAPI ──
    location ~ ^/(route|search|health|docs|openapi.json|redoc) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache chỉ GET requests (POST /route/coords không cache)
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 10m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
}
