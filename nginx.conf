proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;

    # Proxy Cache cho GET requests
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Chỉ cache GET requests (POST /route sẽ không bị cache ở tầng Nginx)
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 10m;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
}
